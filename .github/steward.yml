# Profile of the repo-steward skill (.agents/skills/repo-steward) for godot-mcp.
# Only the keys that differ from the skill's defaults are set; `profile.sh list` shows all.
# The planning ecosystem and the paths readiness ignores are detected, not configured.

project:
  guides: AGENTS.md CONTRIBUTING.md SECURITY.md

board:
  title: godot-mcp issues and pull requests
  # The Godot lines an item affects, for example "4.8 4.7 4.6".
  text_fields: Lines

triage:
  priority_examples: .github/steward-priorities.md

review:
  # Places where a contributor's change runs code while the project builds.
  sensitive_paths: .github/ build.rs .cargo/

limits:
  allowed_bots: dependabot[bot]

autonomy:
  # The steward merges or declines a contributor's pull request itself, after reading the whole
  # diff and running the checks of CONTRIBUTING.md on every Godot line. It is the project's
  # choice for maximum automation: a single maintainer cannot answer every pull request. The
  # hard limits of the skill stay: no release, no force push, no settings or secrets.
  merge_external: allowed

release:
  procedure: .agents/skills/release/SKILL.md, procedure C
  skip_subjects: chore(release) chore(line)
  # Every release contains every Godot line listed here, each built from its own branch.
  targets_file: .github/lines
  target_branch: godot-v{t}
  target_tag: v{version}+godot.{t}
  target_build_file: .github/godot-version
